services:
  postgres_db:
    image: postgres:15-alpine
    container_name: messenger_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  messenger_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: messenger_service
    restart: unless-stopped
    network_mode: "host"
    environment:
      - PYTHONPATH=/code/src
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 81
    # ports:
    #   - "81:81"
    env_file:
      - .env
    depends_on:
      postgres_db:
        condition: service_healthy

volumes:
  postgres_data: