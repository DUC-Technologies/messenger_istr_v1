services:
  postgres_db:
    image: postgres:15-alpine
    container_name: messenger_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  messenger_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: messenger_service
    restart: unless-stopped
    environment:
      - PYTHONPATH=/code/src
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 81
    ports:
      - "${MESSENGER_APP_PORT}:81"
    env_file:
      - .env
    depends_on:
      postgres_db:
        condition: service_healthy

volumes:
  postgres_data: