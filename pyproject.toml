[project]
name = "messenger"
version = "0.1.0"
description = ""
authors = [{ name = "say1ts", email = "tsydenovsayan@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
# Основные зависимости (бывшие [tool.poetry.dependencies])
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "icecream>=2.1.3",
    "sqlalchemy>=2.0.25",
    "pydantic>=2.5.3",
    "loguru>=0.7.2",
    "scylla-driver>=3.26.8",
    "envparse>=0.2.0",
    "websockets>=12.0",
]

# Группы для разработки (стандарт PEP 735, поддерживаемый uv)
[dependency-groups]
dev = [
    "pytest>=7.4.4",
    "python-dotenv>=1.0.1",
    "flake8>=7.0.0",
    "black>=23.12.1",
    "alembic>=1.13.1",
]
dev_auth = [
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "psycopg2>=2.9.9",
    "pydantic[email]>=2.6.4",
    "loguru>=0.7.2",
    "envparse>=0.2.0",
    "asyncpg>=0.29.0",
    "pytest-asyncio>=0.23.6",
]

# Указываем uv, что этот проект — приложение (не библиотека), его не нужно собирать как wheel
[tool.uv]
package = false

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
